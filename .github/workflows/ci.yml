# Runs on every pull request and every push to main: type-check, question-bank checks and a build.
# A red check here means the change would break the site or ship a wrong answer.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the integration tests below (never a real database).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyclip
          POSTGRES_PASSWORD: studyclip
          POSTGRES_DB: studyclip
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U studyclip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the TypeScript sources directly for the question checks.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Question bank, practice sets and generated answers
        run: npm run check:questions

      - name: Help bot answers
        run: npm run test:helpbot

      - name: Sunday mock schedule and shared paper
        run: npm run test:weekly

      - name: Streaks, question of the day and badges
        run: npm run test:habits

      - name: Word and fact of the day
        run: npm run test:daily-learning

      - name: Speed drills, typing scores and formula sheets
        run: npm run test:skills

      - name: Topic revision schedule
        run: npm run test:revision

      - name: Daily reminder hours and cron auth
        run: npm run test:reminders

      - name: Mock analysis, exam palette and error coach
        run: npm run test:analysis

      - name: Store notifications
        run: npm run test:store

      - name: Sub-topic stats and lists
        run: npm run test:subtopics

      - name: Pasted quiz text format
        run: npm run test:quiz-text

      - name: Coding-round problems
        run: npm run test:coding
      - name: Security checks (CSRF, body limits, redirects)
        run: npm run test:security
      - name: Cut-off predictor
        run: npm run test:predictor
      - name: Mock interview coach
        run: npm run test:interview
      - name: Explain-more AI helper
        run: npm run test:explain
      - name: Headline feed reader
        run: npm run test:headlines

      # Server features against the throwaway database: migrations apply cleanly, then accounts,
      # batches, challenges, doubts, content access and institutes are exercised end to end.
      - name: Database integration tests
        run: |
          node scripts/migrate.mjs
          npm run test:account
          npm run test:pass
          npm run test:batches
          npm run test:challenges
          npm run test:doubts
          npm run test:content
          npm run test:institutes
          npm run test:stats
        env:
          DATABASE_URL: postgres://studyclip:studyclip@127.0.0.1:5434/studyclip
          NEON_AUTH_BASE_URL: https://auth.example.invalid/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-not-a-secret-0123456789abcdef

      # The real (server) build with API routes, using placeholder settings: it must compile without
      # touching a database, so build errors in src/server or the API never reach production first.
      - name: Build (server)
        run: npx next build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          NEON_AUTH_BASE_URL: https://auth.example.invalid/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-not-a-secret-0123456789abcdef
          NEXT_TELEMETRY_DISABLED: "1"

      # The static build needs no database or secrets, so it can run on every PR.
      - name: Build (static)
        run: |
          rm -rf src/app/api
          npm run build
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_TELEMETRY_DISABLED: "1"
